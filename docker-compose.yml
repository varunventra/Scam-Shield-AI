version: '3.8'

services:
  scambot-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scambot-honeypot
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - API_KEY=${API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.7}
      - MAX_TOKENS=${MAX_TOKENS:-1000}
      - GUVI_CALLBACK_URL=${GUVI_CALLBACK_URL:-https://hackathon.guvi.in/api/updateHoneyPotFinalResult}
      - DEBUG=${DEBUG:-False}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MAX_CONVERSATION_TURNS=${MAX_CONVERSATION_TURNS:-20}
      - SESSION_TIMEOUT=${SESSION_TIMEOUT:-3600}
      - SCAM_CONFIDENCE_THRESHOLD=${SCAM_CONFIDENCE_THRESHOLD:-0.7}
      - AGENT_NAME=${AGENT_NAME:-Rahul}
      - AGENT_AGE=${AGENT_AGE:-28}
      - AGENT_OCCUPATION=${AGENT_OCCUPATION:-Software Engineer}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
